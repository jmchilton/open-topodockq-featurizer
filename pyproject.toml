[project]
name = "open-topodockq-featurizer"
version = "0.0.1"
description = "Open clean-room reimplementation of the TopoDockQ interface featurizer (petls-pytorch + GUDHI, no .pyc)."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "gudhi",
    "biopython",
    # petls-pytorch fork v2 (isolated-vertex fix) — installed from the local clone / foundry env
    "petls-pytorch",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_topodockq_featurizer"]

[dependency-groups]
dev = ["pytest"]
