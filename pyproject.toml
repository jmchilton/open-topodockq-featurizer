[project]
name = "open-topodockq-featurizer"
version = "0.0.1"
description = "Open clean-room reimplementation of the TopoDockQ interface featurizer (petls-pytorch + GUDHI, no .pyc)."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "gudhi",
    "torch",  # imported directly in featurize.py (petls dtype config); not just transitive
    # petls-pytorch fork v2 (isolated-vertex fix) — installed from the local clone / foundry env
    "petls-pytorch",
]

[tool.uv.sources]
# Use the in-foundry v2 fork (isolated-vertex fix) rather than the buggy PyPI release.
petls-pytorch = { path = "../petls-pytorch", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_topodockq_featurizer"]

[dependency-groups]
dev = ["pytest"]
